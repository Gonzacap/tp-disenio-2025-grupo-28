<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CU04 - Reservar Habitación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="mb-4">CU04 — Reservar Habitación</h2>

    <!-- MENSAJE DE ERROR -->
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <!-- BLOQUE SUPERIOR: RESERVA SELECCIONADA -->
    <div class="card mb-4">
        <div class="card-header bg-primary text-white">Reserva Solicitada</div>
        <div class="card-body">

            <p><strong>Tipo de Habitación:</strong>
                <span th:text="${reservaRequestDTO.tipoHabitacion}"></span>
            </p>

            <p><strong>Ingreso:</strong>
                <span th:text="${reservaRequestDTO.fechaDesde}"></span> (12:00hs)
            </p>

            <p><strong>Egreso:</strong>
                <span th:text="${reservaRequestDTO.fechaHasta}"></span> (10:00hs)
            </p>

            <p><strong>Habitaciones seleccionadas:</strong>
                <span th:text="${reservaRequestDTO.habitaciones}"></span>
            </p>

            <div class="text-end">
                <!-- VOLVER A LA SELECCIÓN DE HABITACIONES -->
                <a th:href="@{/habitacion}" class="btn btn-outline-danger btn-sm">Rechazar / Volver</a>
            </div>

        </div>
    </div>


    <!-- FORMULARIO PRINCIPAL -->
    <form th:action="@{/reserva/crear}" th:object="${reservaRequestDTO}" method="post">

        <!-- CAMPOS OCULTOS QUE VIAJAN AL POST -->
        <input type="hidden" th:field="*{fechaDesde}">
        <input type="hidden" th:field="*{fechaHasta}">
        <input type="hidden" th:field="*{tipoHabitacion}">

        <!-- HABITACIONES -->
        <th:block th:each="idHab : *{habitaciones}">
            <input type="hidden" name="habitaciones" th:value="${idHab}">
        </th:block>

        <!-- DATOS DEL HUÉSPED -->
        <div class="card">
            <div class="card-header">Datos del Huésped</div>
            <div class="card-body">

                <div class="mb-3">
                    <label class="form-label">Apellido (*):</label>
                    <input type="text" class="form-control" th:field="*{apellido}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Nombre (*):</label>
                    <input type="text" class="form-control" th:field="*{nombre}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Teléfono (*):</label>
                    <input type="text" class="form-control" th:field="*{telefono}" required>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">Aceptar</button>
                </div>

            </div>
        </div>

    </form>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const inputs = document.querySelectorAll("input[type='text'], input[type='search']");

    inputs.forEach(input => {
        input.addEventListener("input", () => {
            const start = input.selectionStart;
            const end = input.selectionEnd;
            input.value = input.value.toUpperCase();
            input.setSelectionRange(start, end);
        });
    });
});
</script>

</body>
</html>
