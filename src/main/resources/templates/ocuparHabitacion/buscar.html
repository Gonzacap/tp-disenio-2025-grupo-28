<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Seleccionar Ocupantes - Buscar</title>

    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .panel { border: 1px solid #ccc; padding: 18px; border-radius: 4px; }
        .form-row { display:flex; gap:12px; align-items:center; margin-bottom:10px; }
        label { min-width:90px; }
        input[type=text], select { padding:6px; width:180px; }
        table { width:100%; border-collapse: collapse; margin-top:12px; }
        th, td { border:1px solid #ddd; padding:8px; text-align:left; }
        th { background:#f0f0f0; }
        .actions { margin-top:12px; display:flex; gap:8px; justify-content:flex-end; }
        .btn { padding:6px 12px; border:1px solid #999; background:#eee; cursor:pointer; }
    </style>
</head>

<body>

<h1>Seleccionar Ocupantes - Habitación N° <span th:text="${numero_habitacion}">--</span></h1>

<div class="panel">
    <h3>Buscar Huésped</h3>

    <!-- FORMULARIO DE BÚSQUEDA -->
    <form th:action="@{/ocupacion/buscar}" method="post">

        <!-- DATOS OCULTOS NECESARIOS -->
        <input type="hidden" name="reservaId" th:value="${reservaId}"/>
        <input type="hidden" name="numero_habitacion" th:value="${numero_habitacion}"/>
        <input type="hidden" name="fechaDesde" th:value="${fechaDesde}"/>
        <input type="hidden" name="fechaHasta" th:value="${fechaHasta}"/>

        <div class="form-row">
            <label>Nombre</label>
            <input type="text" name="nombre" placeholder="NOMBRE" th:value="${nombre}"/>

            <label>Apellido</label>
            <input type="text" name="apellido" placeholder="APELLIDO" th:value="${apellido}"/>
        </div>

        <div class="form-row">
            <label>Tipo Documento</label>
            <select name="tipoDocumento">
                <option value="" th:selected="${tipoDocumento == null}">--</option>
                <option value="DNI" th:selected="${tipoDocumento=='DNI'}">DNI</option>
                <option value="LE" th:selected="${tipoDocumento=='LE'}">LE</option>
                <option value="LC" th:selected="${tipoDocumento=='LC'}">LC</option>
                <option value="Pasaporte" th:selected="${tipoDocumento=='Pasaporte'}">Pasaporte</option>
            </select>

            <label>N° Documento</label>
            <input type="text" name="numeroDocumento" placeholder="00000000" th:value="${numeroDocumento}"/>
        </div>

        <div class="actions">
            <button class="btn" type="submit">Buscar</button>
            <a th:href="@{/}" class="btn">Cancelar</a>
        </div>
    </form>
</div>

<div style="height:18px;"></div>

<div class="panel">
    <h3>Resultado de la búsqueda</h3>

    <form th:action="@{/ocupacion/seleccionar}" method="post">

        <!-- CAMPOS OCULTOS NECESARIOS PARA EL PASO SIGUIENTE -->
        <input type="hidden" name="reservaId" th:value="${reservaId}"/>
        <input type="hidden" name="numero_habitacion" th:value="${numero_habitacion}"/>
        <input type="hidden" name="fechaDesde" th:value="${fechaDesde}"/>
        <input type="hidden" name="fechaHasta" th:value="${fechaHasta}"/>

        <table>
            <thead>
            <tr>
                <th style="width:40px;"></th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Tipo Documento</th>
                <th>Número Documento</th>
                <th>Tipo</th>
            </tr>
            </thead>

            <tbody>
<tr th:each="p : ${resultados}">
    <td>
        <input type="checkbox" name="seleccionados" th:value="${p.cuit}"/>
    </td>

    <td th:text="${p.nombre}">Nombre</td>
    <td th:text="${p.apellido}">Apellido</td>
    <td th:text="${p.tipoDocumento}">DNI</td>
    <td th:text="${p.documento}">00000000</td>
    <td>HUESPED</td>
</tr>


            <tr th:if="${resultados == null || #lists.isEmpty(resultados)}">
                <td colspan="6">No se encontraron resultados.</td>
            </tr>
            </tbody>
        </table>

        <div class="actions" style="margin-top:10px;">
            <button class="btn" type="submit">Aceptar</button>
        </div>
    </form>
</div>

<div style="margin-top:10px;color:red;" th:if="${error}" th:text="${error}"></div>
<!-- MODAL DE SOLAPAMIENTO -->
<div id="modal-maintenance">
    <div id="modal-box">
        <div class="modal-content">

            <div class="modal-header bg-warning">
                <h5 class="modal-title">⚠ Reserva Solapada</h5>
            </div>

            <div class="modal-body">
                <p style="font-size:16px;" th:text="${error}">Ya existe una reserva en ese rango de fechas</p>
            </div>

            <div class="modal-footer">
                <!-- CANCELAR -->
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    Cancelar
                </button>

                <!-- OCUPAR IGUAL -->
                <form action="/ocupacion/forzar" method="post">
                    <input type="hidden" name="numero_habitacion" th:value="${numero_habitacion}">
                    <input type="hidden" name="reservaId" th:value="${reservaId}">
                    <input type="hidden" name="fechaDesde" th:value="${fechaDesde}">
                    <input type="hidden" name="fechaHasta" th:value="${fechaHasta}">
                    <button type="submit" class="btn btn-danger">Ocupar Igualmente</button>
                </form>
            </div>

        </div>
    </div>
</div>

<!-- Script para abrir el modal automáticamente -->

<script th:if="${error}">
     var modal = new bootstrap.Modal(document.getElementById('modalSolapamiento'));
    modal.show();
    function maintenance() {
        document.getElementById("modal-maintenance").style.display = "flex";
    }
    function closeModal() {
        document.getElementById("modal-maintenance").style.display = "none";
    }
</script>



</body>
</html>
