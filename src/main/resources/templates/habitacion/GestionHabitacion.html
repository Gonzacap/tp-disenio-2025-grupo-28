<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/Base :: head('Gestion Habitacion')"></head>

<body>
<style>
    .bg-orange {
        background-color: orange !important;
        color: white !important;
    }


    .celda-seleccionada {
        background-color: #0d6efd !important;
        color: white !important;
        border: 2px solid black !important;
        border-radius: 4px;
        padding: 2px 6px;
    }
    .estado-clickable {
        cursor: pointer;
    }
</style>

<div class="container-md my-5">
    <h1 class="text-center mb-4">Hotel Premier - Gestion de Habitaciones</h1>

    <!-- Mensaje error -->
    <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
        <p th:text="${errorMessage}"></p>
    </div>

    <!-- Mensaje éxito -->
    <div th:if="${successMessage}" class="alert alert-success" role="alert">
        <p th:text="${successMessage}"></p>
    </div>

    <!-- FORM FECHAS -->
    <form th:action="@{/habitacion/validar-fecha}" method="post"
        class="needs-validation mx-5 row g-3" novalidate>
        <div class="col-md-4">
            <label class="form-label fw-bold">Fecha Desde</label>
            <input type="date" name="fechaDesde" class="form-control"
            th:value="${fechaDesde}" required>
        </div>

        <div class="col-md-4">
            <label class="form-label fw-bold">Fecha Hasta</label>
            <input type="date" name="fechaHasta" class="form-control"
            th:value="${fechaHasta}" required>
        </div>

        <div class="col-md-4 d-flex align-items-end">
            <button type="submit" class="btn btn-primary me-2">Buscar</button>
            <a th:href="@{/habitacion}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>

    <hr class="my-4"/>

    <!-- GRILLA -->
    <hr class="my-4" /> <!-- Grilla Habitaciones --> <div class="table-responsive mt-4"> 
        <h4 class="mb-3">Disponibilidad de Habitaciones</h4> 
        <table class="table table-bordered text-center align-middle"> 
            <!-- ENCABEZADO --> 
             <thead class="table-light"> <tr> <th>Fecha</th> 
                <!-- Iteramos tipos de habitación --> 
                 <th th:each="tipo : ${habitacionesPorTipo}"> 
                    <div class="fw-bold" th:text="${tipo.nombre}"></div>
                     <!-- Números de habitación en HORIZONTAL --> 
        <div class="d-flex justify-content-center gap-2 mt-1"> 
     <span th:each="num : ${tipo.habitaciones}" class="badge bg-primary" th:text="${num}" ></span>
     </div> 
    </th> 
</tr> 
</thead>
 <!-- CUERPO -->
   <tbody> <tr th:each="row : ${grilla}">
     <!-- Fecha --> <td class="fw-bold" th:text="${#dates.format(row.fecha, 'dd/MM/yyyy')}" >

     </td> <!-- Columnas por tipo --> <td th:each="tipo : ${row.estadosPorTipo}"> 
        <!-- ESTADOS EN HORIZONTAL --> 
         <div class="d-flex justify-content-center gap-2"> 
           <span th:each="estado, i : ${tipo.estados}" 
      th:data-habitacion="${tipo.habitaciones[i.index]}" 
      th:data-estado="${estado}" 
      th:class="${
        (estado == 'DISPONIBLE' ? 'badge bg-success' : 
         estado == 'RESERVADA' || estado == 'confirmada' ? 'badge bg-orange text-dark' :
         estado == 'OCUPADA' ? 'badge bg-danger' : 
         estado == 'FUERA_SERVICIO' ? 'badge bg-warning' :
         'badge bg-secondary')
        + ' estado-clickable'
      }"
      th:text="${estado}">
</span>
        </div>
     </td> 
    </tr> 
</tbody> 
</table> 
</div>

    <!-- BOTONES -->
    <div class="mt-3 text-end">

        <!-- RESERVAR -->
        <form th:action="@{/habitacion/reservar}" method="post" class="d-inline">
            <input type="hidden" name="fechaDesde"
                th:value="${fechaDesde != null ? #dates.format(fechaDesde,'yyyy-MM-dd') : ''}">
            <input type="hidden" name="fechaHasta"
                th:value="${fechaHasta != null ? #dates.format(fechaHasta,'yyyy-MM-dd') : ''}">
            <input type="hidden" id="habitacionesInput" name="habitaciones">

            <button type="submit" class="btn btn-success">RESERVAR</button>
        </form>

        <!-- OCUPAR CU15 -->
        <form th:action="@{/habitacion/ocupar}" method="post" class="d-inline">
            <input type="hidden" name="fechaDesde"
                th:value="${fechaDesde != null ? #dates.format(fechaDesde,'yyyy-MM-dd') : ''}">
            <input type="hidden" name="fechaHasta"
            th:value="${fechaHasta != null ? #dates.format(fechaHasta,'yyyy-MM-dd') : ''}">
            <input type="hidden" id="habitacionesInput2" name="habitaciones">

            <button type="submit" class="btn btn-warning">OCUPAR HABITACION</button>
        </form>

        <a th:href="@{/}" class="btn btn-secondary">CANCELAR</a>
    </div>

    <!-- LEYENDA -->
    <div class="mt-4">
        <h5>Leyenda</h5>
        <div class="d-flex gap-4 mt-2">
            <div><span class="badge bg-success">Disponible</span></div>
            <div><span class="badge bg-warning text-dark">Reservada</span></div>
            <div><span class="badge bg-danger">Ocupada</span></div>
            <div><span class="badge bg-secondary">Fuera de Servicio</span></div>
        </div>
    </div>
</div>

<div th:replace="fragments/Base :: scripts"></div>

<!-- SCRIPT NUEVO -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const seleccionadas = new Set();

        document.querySelectorAll(".estado-clickable").forEach(cell => {
            cell.addEventListener("click", () => {
                const hab = cell.dataset.habitacion;

                if (cell.classList.contains("celda-seleccionada")) {
                    cell.classList.remove("celda-seleccionada");
                    seleccionadas.delete(hab);
                } else {
                    cell.classList.add("celda-seleccionada");
                    seleccionadas.add(hab);
                }

                document.getElementById("habitacionesInput").value =
                    Array.from(seleccionadas).join(",");

                document.getElementById("habitacionesInput2").value =
                    Array.from(seleccionadas).join(",");
            });
        });
    });
    /* --- SHIFT + TAB retrocede campo --- */
document.addEventListener("keydown", function(event) {
    if (event.key === "Tab" && event.shiftKey) {
        event.preventDefault();

        const focusables = Array.from(
            document.querySelectorAll("input, button, select, textarea, a")
        ).filter(el => !el.disabled && el.offsetParent !== null);

        const index = focusables.indexOf(document.activeElement);

        if (index > 0) {
            focusables[index - 1].focus();
        }
    }
});

/* --- Ingreso SIEMPRE en MAYÚSCULAS --- */
document.addEventListener("input", function(event) {
    const target = event.target;

    if (target.tagName === "INPUT" && 
        (target.type === "text" || target.type === "search" || target.type === "email")) {
        const start = target.selectionStart;
        const end = target.selectionEnd;
        target.value = target.value.toUpperCase();
        target.setSelectionRange(start, end);
    }
});



</script>

</body>
</html>
